[versions]
agp = "9.4.0"
# AGP 9 内置 Kotlin 的默认版本较低，而 Miuix 0.9.3 使用 Kotlin 2.4.0 元数据，
# 因此在根构建脚本里把 KGP 提升到同一版本。
kotlin = "2.4.0"
# org.jetbrains.compose:1.11.1 在 Android 侧映射到 androidx.compose 1.11.2
compose = "1.11.2"
miuix = "0.9.3"
activityCompose = "1.13.0"

[libraries]
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
