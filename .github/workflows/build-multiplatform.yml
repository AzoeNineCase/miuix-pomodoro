# 六平台构建：与 miuix 官方预览包对齐
#   android-universal-apk / windows-x64-exe / linux-x64-bin / linux-arm64-bin / darwin-arm64-dmg / ios-arm64-unsigned-ipa
#
# 触发方式：
#   - 手动：Actions → Build Multiplatform → Run workflow（产物在本次运行的 Artifacts 里）
#   - 打标签：git tag v1.0.0 && git push origin v1.0.0（会创建 Release 并附带全部产物）
name: Build Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}

jobs:
  # ---------------------------------------------------------------- Android
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Ensure Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null 2>&1 || true
      - name: Assemble APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon
      - name: Package
        run: |
          mkdir -p ../dist
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk \
             "../dist/PomodoroTimer-android-universal-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app image
        shell: pwsh
        run: .\gradlew.bat :composeApp:createReleaseDistributable --no-daemon
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $name = "PomodoroTimer-windows-x64-exe-$env:VERSION.zip"
          Compress-Archive -Path "composeApp/build/compose/binaries/main-release/app/PomodoroTimer" -DestinationPath "../dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux x64
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build app image
        run: ./gradlew :composeApp:createReleaseDistributable --no-daemon
      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd composeApp/build/compose/binaries/main-release/app
          zip -r "$GITHUB_WORKSPACE/dist/PomodoroTimer-linux-x64-bin-${VERSION}.zip" PomodoroTimer
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux arm64
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build app image
        run: ./gradlew :composeApp:createReleaseDistributable --no-daemon
      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd composeApp/build/compose/binaries/main-release/app
          zip -r "$GITHUB_WORKSPACE/dist/PomodoroTimer-linux-arm64-bin-${VERSION}.zip" PomodoroTimer
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS (Apple Silicon)
  macos:
    name: macOS arm64 DMG
    runs-on: macos-14
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Package DMG
        run: ./gradlew :composeApp:packageReleaseDmg --no-daemon
      - name: Collect artifact
        run: |
          mkdir -p ../dist
          DMG=$(find composeApp/build/compose/binaries -name "*.dmg" | head -n 1)
          cp "$DMG" "../dist/PomodoroTimer-darwin-arm64-dmg-${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS (unsigned)
  ios:
    name: iOS arm64 iPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('multiplatform/gradle/libs.versions.toml') }}
      - name: Make gradlew executable
        working-directory: multiplatform
        run: chmod +x gradlew
      - name: Generate Xcode project
        working-directory: multiplatform/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
          grep -m1 objectVersion iosApp.xcodeproj/project.pbxproj || true
      - name: Build unsigned app
        working-directory: multiplatform/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir -p dist Payload
          cp -R multiplatform/iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r "dist/PomodoroTimer-ios-arm64-unsigned-${VERSION}.ipa" Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: dist/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- Release（打标签时）
  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux-x64, linux-arm64, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
